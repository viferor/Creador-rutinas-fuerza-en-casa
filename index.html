<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Creador de Rutinas Viferor</title>
<style>
:root{--bg:#0a0a0a;--bg2:#151515;--card:#1c1c1e;--card2:#252527;--border:#2e2e30;--text:#fff;--muted:#8e8e93;--accent:#0a84ff;--green:#32d74b;--red:#ff453a;--orange:#ff9f0a;--radius:14px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{margin:0 auto;padding:0 0 120px;width:100%}
header{position:sticky;top:0;background:rgba(10,10,10,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:16px 24px;border-bottom:1px solid var(--border);z-index:100;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
header .sub{font-size:12px;color:var(--muted);font-weight:500}
.container{max-width:1400px;margin:0 auto;padding:0 20px}
.tabs{display:flex;gap:4px;padding:12px 0}
.tab{background:var(--card);border:none;color:var(--muted);padding:10px 18px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;flex:1;min-width:0}
.tab.active{background:var(--accent);color:#fff}
.view{display:none;padding:16px 0;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.section{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.section h3{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
label.sel-label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
select,input[type="text"],input[type="number"],textarea{width:100%;padding:13px 14px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;font-family:inherit;appearance:none;-webkit-appearance:none}
select{background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'%3e%3cpath fill='%238e8e93' d='M6 8L0 0h12z'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
.equip-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:600px){.equip-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.equip-grid{grid-template-columns:repeat(4,1fr)}}
.equip-grid label{background:var(--card2);border:1.5px solid var(--border);border-radius:10px;padding:12px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;user-select:none}
.equip-grid label:active{transform:scale(.97)}
.equip-grid input{display:none}
.equip-grid input:checked + span{color:var(--accent)}
.equip-grid label:has(input:checked){border-color:var(--accent);background:rgba(10,132,255,.08)}
.equip-grid .dot{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;flex-shrink:0}
.equip-grid input:checked + .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.equip-grid input:checked + .dot::after{content:'✓'}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .1s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn-primary{background:#fff;color:#000}
.btn-green{background:var(--green);color:#000;margin-top:10px}
.btn-red{background:var(--red);color:#fff;padding:10px;font-size:13px;width:auto}
.loader{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
.spinner{width:28px;height:28px;border:3px solid var(--card2);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
.empty .ic{font-size:40px;opacity:.4;margin-bottom:8px}
.exercise-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:768px){.exercise-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1200px){.exercise-grid{grid-template-columns:repeat(3,1fr)}}
.exercise-card{background:var(--card);border-radius:var(--radius);padding:14px;border:1px solid var(--border)}
.exercise-actions{display:flex;justify-content:flex-end;gap:4px;margin-bottom:8px}
.act-btn{background:var(--card2);border:none;color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.act-btn:hover{background:var(--accent);color:#fff}
.act-btn:active{transform:scale(.9)}
.act-btn.danger:hover{background:var(--red)}
.exercise-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.exercise-thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--card2);flex-shrink:0;cursor:pointer;transition:transform .15s}
.exercise-thumb:active{transform:scale(.95)}
.exercise-info{flex:1;min-width:0}
.exercise-info h4{font-size:15px;font-weight:700;margin-bottom:3px;line-height:1.25}
.exercise-info .meta{font-size:12px;color:var(--muted);margin-bottom:2px}
.exercise-info .tag{display:inline-block;background:var(--card2);color:var(--muted);padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;margin-right:4px;margin-top:4px}
.exercise-info .tag.body{background:rgba(50,215,75,.15);color:var(--green)}
.exercise-info .tag.iso{background:rgba(255,159,10,.15);color:var(--orange)}
.sets-table{width:100%}
.sets-table .hdr{display:grid;grid-template-columns:32px 1fr 1fr 36px;gap:6px;padding:4px 6px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.set-row{display:grid;grid-template-columns:32px 1fr 1fr 36px;gap:6px;margin-bottom:6px;align-items:center}
.set-row .num{background:var(--card2);border-radius:8px;height:38px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
.set-row input{padding:10px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);text-align:center;font-size:14px;font-weight:600;height:38px;font-family:inherit}
.set-row input:focus{border-color:var(--accent);outline:none}
.set-row input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set-row input[type=number]{-moz-appearance:textfield}
.set-check{height:38px;border-radius:8px;border:none;background:var(--card2);color:var(--muted);font-size:16px;cursor:pointer;transition:all .15s}
.set-check.done{background:var(--green);color:#000}
.set-row.done input{color:var(--green)}
.set-row.done .num{background:var(--green);color:#000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(10px)}
.modal.show{display:flex;animation:fade .2s ease}
.modal-content{max-width:600px;width:100%;text-align:center;max-height:90vh;overflow-y:auto}
.modal-content img{max-width:100%;max-height:50vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-content h3{margin-top:14px;font-size:18px;font-weight:700}
.modal-content .instructions{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.5;max-height:180px;overflow-y:auto;text-align:left;padding:12px;background:rgba(255,255,255,.05);border-radius:10px}
.modal-close{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;font-weight:700;z-index:10}
.replace-list{text-align:left;max-height:60vh;overflow-y:auto;padding:8px}
.replace-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.replace-item:hover{border-color:var(--accent);background:rgba(10,132,255,.08)}
.replace-item:active{transform:scale(.98)}
.replace-item img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--card)}
.replace-item .info{flex:1}
.replace-item .info h4{font-size:14px;font-weight:600;margin-bottom:2px}
.replace-item .info p{font-size:12px;color:var(--muted)}
.hist-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:768px){.hist-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1200px){.hist-grid{grid-template-columns:repeat(3,1fr)}}
.hist-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:transform .1s}
.hist-card:active{transform:scale(.98)}
.hist-date{color:var(--accent);font-size:13px;font-weight:700;margin-bottom:4px}
.hist-title{font-size:15px;font-weight:700;margin-bottom:6px}
.hist-stats{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.hist-stats span strong{color:var(--text);font-weight:700}
.hist-del{float:right;background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:4px}
.detail-back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);background:none;border:none;font-size:15px;font-weight:600;cursor:pointer;padding:8px 0;margin-bottom:8px;font-family:inherit}
.detail-head{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.detail-head h2{font-size:20px;font-weight:800;margin-bottom:4px}
.detail-head .meta{color:var(--muted);font-size:13px}
.detail-stats{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
.detail-stat{flex:1;min-width:120px;background:var(--card2);border-radius:10px;padding:12px;text-align:center}
.detail-stat .v{font-size:20px;font-weight:800;color:var(--accent)}
.detail-stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;letter-spacing:.3px;margin-top:2px}
.empty-state{text-align:center;padding:80px 20px}
.empty-state .ic{font-size:60px;opacity:.3;margin-bottom:14px}
.empty-state h3{font-size:18px;margin-bottom:6px;font-weight:700}
.empty-state p{color:var(--muted);font-size:14px}
.sticky-bottom{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 60%,transparent);padding:16px;margin:-16px -16px 0;z-index:50}
</style>
</head>
<body>
<header>
  <div>
    <h1>Creador de Rutinas Viferor</h1>
    <div class="sub">Tu diario de fuerza personalizado</div>
  </div>
</header>
<div class="container">
<div class="tabs">
  <button class="tab active" data-view="create">➕ Crear</button>
  <button class="tab" data-view="session">💪 Sesión</button>
  <button class="tab" data-view="history">📅 Historial</button>
</div>
<div class="view active" id="view-create">
  <div id="loaderBlock" class="loader">
    <div class="spinner"></div>
    Cargando base de datos de ejercicios…
  </div>
  <div id="formBlock" style="display:none">
    <div class="section">
      <h3>1 · Tipo de sesión</h3>
      <label class="sel-label">Objetivo</label>
      <select id="routineType">
        <option value="fullbody">Full Body · Global equilibrado</option>
        <option value="upper">Tren Superior · Torso completo</option>
        <option value="lower">Tren Inferior · Pierna y glúteo</option>
        <option value="push">Empuje · Pecho, hombro, tríceps</option>
        <option value="pull">Tirón · Espalda, bíceps, trapecio</option>
        <option value="custom">🎯 Músculo específico…</option>
      </select>
      <div id="customGroupWrap" style="display:none;margin-top:12px">
        <label class="sel-label">Elige el grupo muscular</label>
        <select id="customGroup"></select>
      </div>
    </div>
    <div class="section">
      <h3>2 · Estilo de ejercicio</h3>
      <label class="sel-label">Tipo de ejercicios a incluir</label>
      <select id="exerciseStyle">
        <option value="all">Todos (máx. variedad)</option>
        <option value="bodyweight">Solo peso corporal</option>
        <option value="iso">Incluir isométricos</option>
        <option value="mix">Mixto (equipo + peso corporal)</option>
      </select>
    </div>
    <div class="section">
      <h3>3 · Volumen de series</h3>
      <label class="sel-label">Nivel de exigencia</label>
      <select id="level">
        <option value="2">Baja · 2 series (mantenimiento)</option>
        <option value="3" selected>Media · 3 series (clásico)</option>
        <option value="4">Alta · 4 series (máximo estímulo)</option>
      </select>
    </div>
    <div class="section">
      <h3>4 · Tu equipamiento hoy</h3>
      <div class="equip-grid" id="equipGrid"></div>
    </div>
    <button class="btn btn-primary" id="btnGenerate">
      <span>🚀</span><span>Generar Rutina a Medida</span>
    </button>
  </div>
</div>
<div class="view" id="view-session">
  <div id="sessionEmpty" class="empty">
    <div class="ic">🏋️</div>
    No hay sesión en curso.<br>Ve a la pestaña <b>Crear</b> para empezar.
  </div>
  <div id="sessionContent" style="display:none">
    <div class="section" style="padding:12px 16px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <div>
          <div style="font-size:12px;color:var(--muted);font-weight:600">SESIÓN EN CURSO</div>
          <div id="sessionTitle" style="font-size:17px;font-weight:800;margin-top:2px"></div>
        </div>
        <button class="btn btn-red" id="btnCancelSession">✕</button>
      </div>
    </div>
    <div id="exercisesList" class="exercise-grid"></div>
    <div class="sticky-bottom">
      <textarea id="sessionNotes" placeholder="📝 Notas: cómo te sentiste, pesos usados, sensaciones…"></textarea>
      <button class="btn btn-green" id="btnFinish">✓ Finalizar y guardar entrenamiento</button>
    </div>
  </div>
</div>
<div class="view" id="view-history">
  <div id="historyList" class="hist-grid"></div>
</div>
<div class="view" id="view-detail">
  <button class="detail-back" id="btnBackHist">← Volver</button>
  <div id="detailBody"></div>
</div>
</div>
<div class="modal" id="gifModal">
  <button class="modal-close" id="modalClose">✕</button>
  <div class="modal-content">
    <img id="modalImg" src="" alt="">
    <h3 id="modalTitle"></h3>
    <div class="instructions" id="modalInstr"></div>
  </div>
</div>
<div class="modal" id="replaceModal">
  <button class="modal-close" id="replaceModalClose">✕</button>
  <div class="modal-content">
    <h3 style="margin-bottom:12px">🔄 Cambiar ejercicio</h3>
    <p style="color:var(--muted);font-size:13px;margin-bottom:12px" id="replaceInfo"></p>
    <div class="replace-list" id="replaceList"></div>
  </div>
</div>
<script>
const DATA_URL = 'https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json';
const MEDIA_BASE = 'https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/';
const EQUIP_LIST = [
  {key:'body weight',label:'🏃 Peso corporal'},
  {key:'dumbbell',label:'🏋️ Mancuernas'},
  {key:'barbell',label:'💪 Barra'},
  {key:'kettlebell',label:'🔔 Kettlebell'},
  {key:'cable',label:'🔗 Polea/Cable'},
  {key:'leverage machine',label:'⚙️ Máquina'},
  {key:'smith machine',label:'🔩 Smith'},
  {key:'band',label:'🎽 Banda elástica'},
  {key:'stability ball',label:'⚽ Fitball'},
  {key:'ez barbell',label:'🌀 Barra Z'},
  {key:'other',label:'➕ Otro'}
];
const DEFAULT_EQUIP = new Set(['body weight','dumbbell','barbell','kettlebell','cable','leverage machine']);
let DB = [];
let currentSession = null;
let replaceIdx = null;
const STORAGE_KEY = 'viferor_sessions_v1';

(async function init(){
  const grid = document.getElementById('equipGrid');
  EQUIP_LIST.forEach(eq=>{
    const lbl = document.createElement('label');
    lbl.innerHTML = `<input type="checkbox" value="${eq.key}" ${DEFAULT_EQUIP.has(eq.key)?'checked':''}><span class="dot"></span><span>${eq.label}</span>`;
    grid.appendChild(lbl);
  });
  try {
    const res = await fetch(DATA_URL);
    DB = await res.json();
    document.getElementById('loaderBlock').style.display='none';
    document.getElementById('formBlock').style.display='block';
    populateGroups();
  } catch(e){
    document.getElementById('loaderBlock').innerHTML = '❌ Error cargando la base de datos.';
    return;
  }
  renderHistory();
  bindEvents();
})();

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+t.dataset.view).classList.add('active');
    window.scrollTo(0,0);
  });
});

function showView(name){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.view===name));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  window.scrollTo(0,0);
}

function populateGroups(){
  const sel = document.getElementById('customGroup');
  const cats = [...new Set(DB.map(e=>e.category))].sort();
  sel.innerHTML = cats.map(c=>`<option value="${c}">${formatCategory(c)}</option>`).join('');
}

function formatCategory(c){
  const map = {'chest':'Pecho','back':'Espalda','shoulders':'Hombros','upper arms':'Brazos','lower arms':'Antebrazos','upper legs':'Piernas','lower legs':'Gemelos','waist':'Core/Abdomen','cardio':'Cardio','neck':'Cuello'};
  return map[c] || c;
}

function bindEvents(){
  const rt = document.getElementById('routineType');
  rt.addEventListener('change',()=>{
    document.getElementById('customGroupWrap').style.display = rt.value==='custom'?'block':'none';
  });
  document.getElementById('btnGenerate').addEventListener('click', generateRoutine);
  document.getElementById('btnFinish').addEventListener('click', finishSession);
  document.getElementById('btnCancelSession').addEventListener('click', ()=>{
    if(confirm('¿Descartar la sesión actual?')){
      currentSession = null;
      renderSessionView();
    }
  });
  document.getElementById('modalClose').addEventListener('click',()=>document.getElementById('gifModal').classList.remove('show'));
  document.getElementById('gifModal').addEventListener('click', e=>{if(e.target.id==='gifModal') e.currentTarget.classList.remove('show');});
  document.getElementById('replaceModalClose').addEventListener('click',()=>document.getElementById('replaceModal').classList.remove('show'));
  document.getElementById('replaceModal').addEventListener('click', e=>{if(e.target.id==='replaceModal') e.currentTarget.classList.remove('show');});
  document.getElementById('btnBackHist').addEventListener('click',()=>showView('history'));
}

function generateRoutine(){
  const rt = document.getElementById('routineType').value;
  const level = parseInt(document.getElementById('level').value);
  const style = document.getElementById('exerciseStyle').value;
  const equipSet = new Set([...document.querySelectorAll('#equipGrid input:checked')].map(i=>i.value));
  if(equipSet.size===0){alert('Selecciona al menos un equipamiento.');return;}
  let pool = DB.filter(e => equipSet.has(e.equipment));
  let isoPool = [];
  if(style==='bodyweight'){pool = pool.filter(e => e.equipment === 'body weight');}
  else if(style==='iso'){
    const isoKeys = ['plank','hold','isometric','wall sit','hollow','superman hold','bridge hold','static','side plank','front plank','dead hang','l-sit','handstand hold'];
    const isIso = e => isoKeys.some(k => (e.name||'').toLowerCase().includes(k));
    isoPool = pool.filter(isIso);
    pool = pool.filter(e=>!isIso(e));
  }
  if(pool.length===0){alert('No hay ejercicios disponibles.');return;}
  let targetCats = [];
  const countPerCat = {};
  if(rt==='fullbody'){targetCats = ['chest','back','shoulders','upper legs','waist'];targetCats.forEach(c=>countPerCat[c]=2);}
  else if(rt==='upper'){targetCats = ['chest','back','shoulders','upper arms'];countPerCat.chest=2;countPerCat.back=2;countPerCat.shoulders=2;countPerCat['upper arms']=2;}
  else if(rt==='lower'){targetCats = ['upper legs','lower legs','waist'];countPerCat['upper legs']=3;countPerCat['lower legs']=2;countPerCat.waist=2;}
  else if(rt==='push'){targetCats = ['chest','shoulders','upper arms'];countPerCat.chest=2;countPerCat.shoulders=2;countPerCat['upper arms']=2;}
  else if(rt==='pull'){targetCats = ['back','upper arms'];countPerCat.back=3;countPerCat['upper arms']=2;}
  else if(rt==='custom'){const g = document.getElementById('customGroup').value;targetCats = [g];countPerCat[g] = 5;}
  const chosen = [];
  targetCats.forEach(cat=>{
    const catPool = pool.filter(e=>e.category===cat);
    const shuffled = shuffle(catPool);
    chosen.push(...shuffled.slice(0,countPerCat[cat]||2));
  });
  if(style==='iso' && isoPool.length){chosen.push(...shuffle(isoPool).slice(0,2));}
  const finalExercises = shuffle(chosen).map(ex=>({
    ...ex,
    sets: Array.from({length:level},(_,i)=>({n:i+1,kg:'',reps:'',done:false}))
  }));
  currentSession = {id: Date.now(),date: new Date().toISOString(),routineType: rt,level: level,equipment: [...equipSet],exercises: finalExercises,notes: ''};
  renderSessionView();
  showView('session');
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function renderSessionView(){
  const empty = document.getElementById('sessionEmpty');
  const content = document.getElementById('sessionContent');
  if(!currentSession){empty.style.display='block';content.style.display='none';return;}
  empty.style.display='none';
  content.style.display='block';
  const rtNames = {fullbody:'Full Body',upper:'Tren Superior',lower:'Tren Inferior',push:'Empuje',pull:'Tirón',custom:'Músculo específico'};
  document.getElementById('sessionTitle').textContent = rtNames[currentSession.routineType] || 'Sesión';
  const list = document.getElementById('exercisesList');
  list.innerHTML = '';
  currentSession.exercises.forEach((ex,idx)=>{list.appendChild(buildExerciseCard(ex,idx));});
}

function buildExerciseCard(ex, idx){
  const card = document.createElement('div');
  card.className = 'exercise-card';
  const thumbUrl = ex.image ? MEDIA_BASE + ex.image : '';
  const isBodyweight = ex.equipment === 'body weight';
  const isIso = (ex.name||'').toLowerCase().match(/plank|hold|isometric|wall sit|hollow|superman hold|bridge hold|static|l-sit|dead hang|handstand hold/);

  card.innerHTML = `
    <div class="exercise-actions">
      <button class="act-btn" title="Subir" data-act="up">↑</button>
      <button class="act-btn" title="Bajar" data-act="down">↓</button>
      <button class="act-btn" title="Cambiar ejercicio" data-act="replace">🔄</button>
      <button class="act-btn danger" title="Eliminar" data-act="remove">✕</button>
    </div>
    <div class="exercise-head">
      <img class="exercise-thumb" src="${thumbUrl}" alt="" loading="lazy" onerror="this.style.background='#2a2a2a'">
      <div class="exercise-info">
        <h4>${ex.name}</h4>
        <div class="meta">${formatCategory(ex.category)} · ${formatEquip(ex.equipment)}</div>
        ${isBodyweight?'<span class="tag body">🏃 Peso corporal</span>':''}
        ${isIso?'<span class="tag iso">⏱ Isométrico</span>':''}
        ${ex.target?`<span class="tag">🎯 ${ex.target}</span>`:''}
      </div>
    </div>
    <div class="sets-table">
      <div class="hdr"><div>SET</div><div>KG</div><div>REPS</div><div></div></div>
      ${ex.sets.map((s,i)=>`<div class="set-row" data-set="${i}"><div class="num">${i+1}</div><input type="number" step="0.5" min="0" placeholder="0" value="${s.kg}" data-field="kg"><input type="number" min="0" placeholder="0" value="${s.reps}" data-field="reps"><button class="set-check ${s.done?'done':''}">✓</button></div>`).join('')}
    </div>`;

  card.querySelectorAll('.act-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const act = btn.dataset.act;
      if(act==='up') moveExercise(idx, -1);
      else if(act==='down') moveExercise(idx, 1);
      else if(act==='replace') openReplaceModal(idx);
      else if(act==='remove') removeExercise(idx);
    });
  });

  card.querySelector('.exercise-thumb').addEventListener('click',()=>openGifModal(ex));
  card.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const setIdx = parseInt(e.target.closest('.set-row').dataset.set);
      const field = e.target.dataset.field;
      currentSession.exercises[idx].sets[setIdx][field] = e.target.value;
    });
  });
  card.querySelectorAll('.set-check').forEach((btn,i)=>{
    btn.addEventListener('click',()=>{
      currentSession.exercises[idx].sets[i].done = !currentSession.exercises[idx].sets[i].done;
      btn.classList.toggle('done');
      btn.closest('.set-row').classList.toggle('done', currentSession.exercises[idx].sets[i].done);
    });
  });
  return card;
}

function moveExercise(idx, dir){
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= currentSession.exercises.length) return;
  const arr = currentSession.exercises;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  renderSessionView();
}

function removeExercise(idx){
  if(!confirm('¿Eliminar este ejercicio de la sesión?')) return;
  currentSession.exercises.splice(idx, 1);
  renderSessionView();
}

function openReplaceModal(idx){
  replaceIdx = idx;
  const ex = currentSession.exercises[idx];
  document.getElementById('replaceInfo').textContent = `Sustituyendo: ${ex.name} (${formatCategory(ex.category)})`;
  const equipSet = new Set(currentSession.equipment);
  const alternatives = DB.filter(e =>
    e.category === ex.category &&
    e.name !== ex.name &&
    equipSet.has(e.equipment)
  ).slice(0, 20);

  const list = document.getElementById('replaceList');
  if(alternatives.length === 0){
    list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">No hay alternativas disponibles.</p>';
  } else {
    list.innerHTML = alternatives.map((alt,i)=>`
      <div class="replace-item" data-idx="${i}">
        <img src="${alt.image ? MEDIA_BASE + alt.image : ''}" onerror="this.style.background='#2a2a2a'">
        <div class="info">
          <h4>${alt.name}</h4>
          <p>${formatEquip(alt.equipment)}${alt.target ? ' · 🎯 '+alt.target : ''}</p>
        </div>
      </div>`).join('');
  }

  list.querySelectorAll('.replace-item').forEach(item=>{
    item.addEventListener('click',()=>{
      const altIdx = parseInt(item.dataset.idx);
      const alt = alternatives[altIdx];
      currentSession.exercises[replaceIdx] = {
        ...alt,
        sets: currentSession.exercises[replaceIdx].sets
      };
      document.getElementById('replaceModal').classList.remove('show');
      renderSessionView();
    });
  });

  document.getElementById('replaceModal').classList.add('show');
}

function formatEquip(eq){
  const map = {'body weight':'Peso corporal','dumbbell':'Mancuernas','barbell':'Barra','kettlebell':'Kettlebell','cable':'Polea','leverage machine':'Máquina','smith machine':'Smith','band':'Banda','stability ball':'Fitball','ez barbell':'Barra Z'};
  return map[eq] || eq;
}

function openGifModal(ex){
  const modal = document.getElementById('gifModal');
  const gifUrl = ex.gif_url ? MEDIA_BASE + ex.gif_url : (ex.image ? MEDIA_BASE + ex.image : '');
  document.getElementById('modalImg').src = gifUrl;
  document.getElementById('modalTitle').textContent = ex.name;
  document.getElementById('modalInstr').textContent = ex.instructions?.es || ex.instructions?.en || 'Sigue las indicaciones del GIF.';
  modal.classList.add('show');
}

function finishSession(){
  if(!currentSession) return;
  currentSession.notes = document.getElementById('sessionNotes').value.trim();
  const anyDone = currentSession.exercises.some(e=>e.sets.some(s=>s.done));
  if(!anyDone && !confirm('No has marcado ninguna serie. ¿Guardar de todos modos?')) return;
  const totalSets = currentSession.exercises.reduce((a,e)=>a+e.sets.length,0);
  const doneSets = currentSession.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
  const totalVolume = currentSession.exercises.reduce((a,e)=>a + e.sets.reduce((b,s)=> b + (s.done && s.kg && s.reps ? parseFloat(s.kg)*parseInt(s.reps) : 0), 0),0);
  currentSession.stats = {exercises: currentSession.exercises.length,totalSets, doneSets,volume: Math.round(totalVolume)};
  const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  all.unshift(currentSession);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
  currentSession = null;
  document.getElementById('sessionNotes').value = '';
  renderSessionView();
  renderHistory();
  showView('history');
}

function renderHistory(){
  const list = document.getElementById('historyList');
  const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  if(all.length===0){
    list.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="ic">📋</div><h3>Aún no hay entrenamientos</h3><p>Cuando termines tu primera sesión aparecerá aquí.</p></div>`;
    return;
  }
  list.innerHTML = all.map(s=>{
    const d = new Date(s.date);
    const dateStr = d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
    const timeStr = d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    const rtNames = {fullbody:'Full Body',upper:'Tren Superior',lower:'Tren Inferior',push:'Empuje',pull:'Tirón',custom:'Específico'};
    const done = s.stats?.doneSets ?? 0;
    const total = s.stats?.totalSets ?? 0;
    const vol = s.stats?.volume ?? 0;
    return `<div class="hist-card" data-id="${s.id}"><button class="hist-del" data-del="${s.id}">🗑</button><div class="hist-date">${dateStr} · ${timeStr}</div><div class="hist-title">${rtNames[s.routineType]||'Sesión'}</div><div class="hist-stats"><span><strong>${s.exercises?.length||0}</strong> ejercicios</span><span><strong>${done}/${total}</strong> series</span>${vol?`<span><strong>${vol.toLocaleString('es-ES')}</strong> kg</span>`:''}</div></div>`;
  }).join('');
  list.querySelectorAll('.hist-card').forEach(c=>{
    c.addEventListener('click', e=>{
      if(e.target.dataset.del) return;
      openDetail(parseInt(c.dataset.id));
    });
  });
  list.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', e=>{
      e.stopPropagation();
      if(!confirm('¿Eliminar este entrenamiento?')) return;
      const id = parseInt(b.dataset.del);
      const h = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]').filter(x=>x.id!==id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
      renderHistory();
    });
  });
}

function openDetail(id){
  const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  const s = all.find(x=>x.id===id);
  if(!s) return;
  const d = new Date(s.date);
  const rtNames = {fullbody:'Full Body',upper:'Tren Superior',lower:'Tren Inferior',push:'Empuje',pull:'Tirón',custom:'Específico'};
  const body = document.getElementById('detailBody');
  body.innerHTML = `<div class="detail-head"><h2>${rtNames[s.routineType]||'Sesión'}</h2><div class="meta">${d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div class="detail-stats"><div class="detail-stat"><div class="v">${s.exercises?.length||0}</div><div class="l">Ejercicios</div></div><div class="detail-stat"><div class="v">${s.stats?.doneSets||0}</div><div class="l">Series</div></div><div class="detail-stat"><div class="v">${(s.stats?.volume||0).toLocaleString('es-ES')}</div><div class="l">Volumen (kg)</div></div></div></div><div class="exercise-grid">${s.exercises.map(ex=>`<div class="exercise-card"><div class="exercise-head"><img class="exercise-thumb" src="${ex.image?MEDIA_BASE+ex.image:''}"><div class="exercise-info"><h4>${ex.name}</h4><div class="meta">${formatCategory(ex.category)} · ${formatEquip(ex.equipment)}</div></div></div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">${ex.sets.map(set=>`<div style="background:var(--card2);padding:6px 10px;border-radius:8px;font-size:12px;${set.done?'':'opacity:.5'}">${set.n}ª · ${set.kg||'–'}kg × ${set.reps||'–'} ${set.done?'✓':''}</div>`).join('')}</div></div>`).join('')}</div>${s.notes ? `<div class="section" style="font-style:italic;color:var(--muted)">"${s.notes}"</div>` : ''}`;
  body.querySelectorAll('.exercise-thumb').forEach((t,i)=>{
    t.addEventListener('click',()=>openGifModal(s.exercises[i]));
  });
  showView('detail');
}
</script>
</body>
</html>
