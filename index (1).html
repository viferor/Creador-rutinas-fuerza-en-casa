<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Diario de Entrenamiento - Estilo Hevy</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos visuales modernos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <!-- CONTENEDOR PRINCIPAL: Optimizado para móvil y centrado en pantallas grandes -->
    <div class="max-w-md mx-auto bg-slate-800 min-h-screen shadow-2xl flex flex-col justify-between border-x border-slate-700">
        
        <!-- CABECERA -->
        <header class="bg-slate-850 p-5 border-b border-slate-700 sticky top-0 z-50 backdrop-blur-md bg-opacity-95">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-400">
                        <i class="fa-solid fa-dumbbell mr-2"></i>TRACKER FUERZA
                    </h1>
                    <p class="text-xs text-slate-400">Diseñado para tu material de casa</p>
                </div>
                <div class="bg-slate-700 px-3 py-1 rounded-full text-xs font-semibold text-emerald-400 border border-slate-600">
                    <i class="fa-solid fa-circle-check mr-1 animate-pulse"></i>Listo
                </div>
            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="p-4 flex-grow space-y-6">
            
            <!-- SECCIÓN 1: CONFIGURADOR DE RUTINA -->
            <section class="bg-slate-850 p-4 rounded-2xl border border-slate-700 space-y-4">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 flex items-center">
                    <i class="fa-solid fa-sliders mr-2 text-emerald-400"></i>Configurar Sesión
                </h2>

                <!-- Selector de Enfoque -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-slate-300">Enfoque del entrenamiento:</label>
                    <select id="select-enfoque" onchange="toggleMusculosSelector()" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                        <option value="fullbody">Full Body (Cuerpo Completo)</option>
                        <option value="torso">Zona: Torso (Empuje y Tracción)</option>
                        <option value="pierna">Zona: Pierna y Glúteo</option>
                        <option value="especifico">Músculos Específicos...</option>
                    </select>
                </div>

                <!-- Selector de Músculos Específicos (Oculto por defecto) -->
                <div id="wrapper-musculos" class="hidden space-y-1.5 animate-fadeIn">
                    <label class="text-xs font-medium text-slate-300">Selecciona el grupo principal:</label>
                    <select id="select-musculo" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                        <option value="pecho">Pecho</option>
                        <option value="espalda">Espalda / Dorsal</option>
                        <option value="hombros">Hombros / Deltoides</option>
                        <option value="brazos">Brazos (Bíceps y Tríceps)</option>
                        <option value="piernas">Piernas / Cuádriceps / Femoral</option>
                        <option value="core">Core / Abdominales</option>
                    </select>
                </div>

                <!-- Selector de Exigencia -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-slate-300">Nivel de exigencia (Series):</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="setExigencia('baja', this)" class="btn-exigencia bg-slate-700 border border-slate-600 rounded-xl py-2 text-xs font-semibold text-slate-300 hover:bg-slate-600 transition">
                            Baja (2 Series)
                        </button>
                        <button type="button" onclick="setExigencia('media', this)" class="btn-exigencia bg-emerald-500 border border-emerald-400 rounded-xl py-2 text-xs font-bold text-slate-950 shadow-lg shadow-emerald-500/20">
                            Media (3 Series)
                        </button>
                        <button type="button" onclick="setExigencia('alta', this)" class="btn-exigencia bg-slate-700 border border-slate-600 rounded-xl py-2 text-xs font-semibold text-slate-300 hover:bg-slate-600 transition">
                            Alta (4 Series)
                        </button>
                    </div>
                </div>

                <!-- Selector de Equipamiento Disponible -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-slate-300">Material disponible hoy:</label>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <label class="flex items-center space-x-2 bg-slate-700 p-2.5 rounded-xl border border-slate-600 cursor-pointer select-none">
                            <input type="checkbox" id="eq-mancuernas" checked class="rounded text-emerald-500 focus:ring-0 bg-slate-600 border-slate-500 w-4 h-4">
                            <span>Mancuernas (5-7.5kg)</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-700 p-2.5 rounded-xl border border-slate-600 cursor-pointer select-none">
                            <input type="checkbox" id="eq-kettlebells" checked class="rounded text-emerald-500 focus:ring-0 bg-slate-600 border-slate-500 w-4 h-4">
                            <span>Kettlebells (8-16kg)</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-700 p-2.5 rounded-xl border border-slate-600 cursor-pointer select-none">
                            <input type="checkbox" id="eq-barra" checked class="rounded text-emerald-500 focus:ring-0 bg-slate-600 border-slate-500 w-4 h-4">
                            <span>Barra Dominadas</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-700 p-2.5 rounded-xl border border-slate-600 cursor-pointer select-none">
                            <input type="checkbox" id="eq-banco" checked class="rounded text-emerald-500 focus:ring-0 bg-slate-600 border-slate-500 w-4 h-4">
                            <span>Banco / Silla</span>
                        </label>
                    </div>
                </div>

                <!-- Botón de Generar Rutina -->
                <button type="button" onclick="generarRutina()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg shadow-emerald-500/20 hover:opacity-90 active:scale-95 transition text-sm uppercase tracking-wider">
                    <i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Generar Entrenamiento
                </button>
            </section>

            <!-- SECCIÓN 2: RUTINA ACTIVA (Se rellena con JavaScript) -->
            <section id="rutina-activa-wrapper" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-base font-bold text-white flex items-center">
                        <i class="fa-solid fa-play mr-2 text-emerald-400"></i>Entrenamiento del Día
                    </h2>
                    <span id="contador-ejercicios" class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full font-mono"></span>
                </div>
                
                <!-- Lista de Ejercicios Generados -->
                <div id="lista-ejercicios" class="space-y-4"></div>

                <!-- Campo de notas globales del entrenamiento -->
                <div class="bg-slate-850 p-4 rounded-2xl border border-slate-700 space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block">
                        <i class="fa-solid fa-pen-to-square mr-1"></i>Notas Generales de la Sesión
                    </label>
                    <textarea id="notas-sesion" placeholder="¿Cómo te has sentido? Fatiga del rodillo, sensaciones de fuerza..." class="w-full bg-slate-700 border border-slate-600 rounded-xl p-2.5 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500 h-20 resize-none"></textarea>
                </div>

                <!-- Botón Finalizar -->
                <button type="button" onclick="finalizarRutina()" class="w-full bg-emerald-500 text-slate-950 font-extrabold py-3.5 px-4 rounded-xl shadow-lg hover:bg-emerald-400 transition text-sm uppercase tracking-wider">
                    <i class="fa-solid fa-circle-check mr-2"></i>Finalizar y Guardar Entrenamiento
                </button>
            </section>

            <!-- SECCIÓN 3: HISTORIAL Y ESTADÍSTICAS -->
            <section class="bg-slate-850 p-4 rounded-2xl border border-slate-700 space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 flex items-center">
                        <i class="fa-solid fa-clock-rotate-left mr-2 text-teal-400"></i>Historial de Sesiones
                    </h2>
                    <button onclick="limpiarHistorial()" class="text-slate-500 hover:text-rose-400 text-xs transition">
                        <i class="fa-solid fa-trash-can mr-1"></i>Borrar todo
                    </button>
                </div>

                <!-- Lista de entrenamientos guardados -->
                <div id="contenedor-historial" class="space-y-3 max-h-60 overflow-y-auto custom-scrollbar pr-1">
                    <!-- Mensaje vacío por defecto -->
                    <p id="historial-vacio" class="text-xs text-slate-500 text-center py-4 italic">No hay entrenamientos registrados todavía.</p>
                </div>
            </section>

        </main>

        <!-- PIE DE PÁGINA -->
        <footer class="p-4 bg-slate-850 border-t border-slate-700 text-center text-[10px] text-slate-500">
            Mi Diario de Fuerza v2.0 • Hecho para sincronizar con ciclismo & running
        </footer>
    </div>

    <!-- ==================== LOGICA JAVASCRIPT ==================== -->
    <script>
        // 1. DATASET DE EJERCICIOS EXTRACTO Y ADAPTADO DEL DATASET OFICIAL DE GITHUB
        // Incluye los IDs correctos y URLs de la arquitectura del repositorio original para cargar los GIFs reales.
        const datasetEjercicios = [
            // PECHO
            { id: "0291", name: "Dumbbell Bench Press", esp: "Press de banca con mancuernas", target: "pecho", zone: "torso", eq: ["mancuernas", "banco"], gif: "0291", cues: "Túmbate en el banco. Mantén los pies planos en el suelo y retrae las escápulas. Empuja verticalmente controlando la bajada." },
            { id: "0308", name: "Dumbbell Fly", esp: "Aperturas con mancuernas en banco", target: "pecho", zone: "torso", eq: ["mancuernas", "banco"], gif: "0308", cues: "Mantén una ligera flexión en los codos. Abre los brazos formando un arco ancho hasta sentir el estiramiento en el pectoral." },
            { id: "0652", name: "Kettlebell Floor Press", esp: "Press en el suelo con kettlebell", target: "pecho", zone: "torso", eq: ["kettlebells"], gif: "0652", cues: "Acostado boca arriba en el suelo. Apoya bien los tríceps al bajar antes de iniciar la fase concéntrica explosiva." },
            
            // ESPALDA
            { id: "0651", name: "Pull-up", esp: "Dominadas estrictas (Pronas)", target: "espalda", zone: "torso", eq: ["barra"], gif: "0651", cues: "Cuelga completamente de la barra. Inicia el tirón deprimiendo las escápulas. Lleva el pecho hacia la barra de forma controlada." },
            { id: "0292", name: "Dumbbell Bent Over Row", esp: "Remo inclinado con mancuernas", target: "espalda", zone: "torso", eq: ["mancuernas"], gif: "0292", cues: "Bisagra de cadera manteniendo la espalda recta a 45 grados. Lleva las mancuernas hacia la cadera apretando el dorsal." },
            { id: "0539", name: "Kettlebell One Arm Row", esp: "Remo unilateral con kettlebell", target: "espalda", zone: "torso", eq: ["kettlebells", "banco"], gif: "0539", cues: "Apoya una rodilla y mano en el banco/silla. Realiza el remo con el brazo libre enfocando la fuerza en el codo hacia atrás." },
            
            // HOMBROS
            { id: "0329", name: "Dumbbell Lateral Raise", esp: "Elevaciones laterales con mancuernas", target: "hombros", zone: "torso", eq: ["mancuernas"], gif: "0329", cues: "Eleva las mancuernas hacia los lados guiando el movimiento con los codos. No subas más allá de la línea del hombro." },
            { id: "0335", name: "Dumbbell Shoulder Press", esp: "Press militar sentado con mancuernas", target: "hombros", zone: "torso", eq: ["mancuernas", "banco"], gif: "0335", cues: "Siéntate con la espalda bien apoyada. Sube las mancuernas sin bloquear los codos por completo arriba." },
            { id: "0524", name: "Kettlebell Goblet Clean", esp: "Cargada Goblet con Kettlebell", target: "hombros", zone: "torso", eq: ["kettlebells"], gif: "0524", cues: "Movimiento fluido y potente desde las caderas para llevar la kettlebell a la posición frontal agarrada por los cuernos." },
            
            // BRAZOS
            { id: "0313", name: "Dumbbell Biceps Curl", esp: "Curl de bíceps alterno con mancuernas", target: "brazos", zone: "torso", eq: ["mancuernas"], gif: "0313", cues: "Mantén los codos pegados a los costados. Gira las muñecas hacia arriba al subir y aprieta el bíceps en el punto máximo." },
            { id: "0316", name: "Dumbbell Triceps Extension", esp: "Extensión de tríceps tras nuca con mancuerna", target: "brazos", zone: "torso", eq: ["mancuernas"], gif: "0316", cues: "Sujeta la mancuerna con ambas manos tras la cabeza. Mantén los codos cerrados apuntando hacia el frente durante la extensión." },
            { id: "0531", name: "Kettlebell Biceps Curl", esp: "Curl de bíceps con kettlebell", target: "brazos", zone: "torso", eq: ["kettlebells"], gif: "0531", cues: "Agarra la pesa rusa de los laterales del asa y realiza la flexión de codo aislando el movimiento muscular." },
            
            // PIERNAS
            { id: "0522", name: "Kettlebell Goblet Squat", esp: "Sentadilla Goblet con kettlebell", target: "piernas", zone: "pierna", eq: ["kettlebells"], gif: "0522", cues: "Sujeta la pesa pegada al pecho. Baja rompiendo el paralelo manteniendo el torso lo más vertical posible y rodillas hacia fuera." },
            { id: "0354", name: "Dumbbell Lunge", esp: "Zancadas alternas con mancuernas", target: "piernas", zone: "pierna", eq: ["mancuernas"], gif: "0354", cues: "Da un paso adelante amplio. La rodilla trasera debe quedar a un centímetro del suelo. Controla la estabilidad central." },
            { id: "0379", name: "Dumbbell Romanian Deadlift", esp: "Peso muerto rumano con mancuernas", target: "piernas", zone: "pierna", eq: ["mancuernas"], gif: "0379", cues: "Bisagra de cadera pura. Desplaza el glúteo hacia atrás bajando las mancuernas pegadas a tus piernas. Siente estiramiento en femorales." },
            { id: "0542", name: "Kettlebell Pistol Squat", esp: "Sentadilla a una pierna (Pistol) asistida", target: "piernas", zone: "pierna", eq: ["kettlebells", "banco"], gif: "0542", cues: "Ejercicio unilateral de máxima transferencia. Baja de forma controlada a una pierna controlando la caída con el banco/silla." },
            
            // CORE
            { id: "0001", name: "3/4 Sit-up", esp: "Abdominales 3/4 sit-up", target: "core", zone: "pierna", eq: [], gif: "0001", cues: "Túmbate con rodillas dobladas. Levanta el torso enrollando la columna mediante la contracción del abdomen." },
            { id: "0538", name: "Kettlebell Russian Twist", esp: "Giro ruso con kettlebell", target: "core", zone: "torso", eq: ["kettlebells"], gif: "0538", cues: "Siéntate inclinando el torso atrás. Rota el torso llevando la kettlebell de un lado al otro activando oblicuos de forma férrea." }
        ];

        // Estado de la aplicación
        let nivelExigencia = 'media';
        let numSeriesPorEjercicio = 3;
        let rutinaGeneradaActual = [];

        // Cambiar dinámicamente la visibilidad del selector de músculos específicos
        function toggleMusculosSelector() {
            const enfoque = document.getElementById('select-enfoque').value;
            const wrapper = document.getElementById('wrapper-musculos');
            if (enfoque === 'especifico') {
                wrapper.classList.remove('hidden');
            } else {
                wrapper.classList.add('hidden');
            }
        }

        // Configurar la exigencia y cambiar estilos visuales de los botones
        function setExigencia(nivel, botonActivo) {
            nivelExigencia = nivel;
            if(nivel === 'baja') numSeriesPorEjercicio = 2;
            if(nivel === 'media') numSeriesPorEjercicio = 3;
            if(nivel === 'alta') numSeriesPorEjercicio = 4;

            document.querySelectorAll('.btn-exigencia').forEach(btn => {
                btn.className = "btn-exigencia bg-slate-700 border border-slate-600 rounded-xl py-2 text-xs font-semibold text-slate-300 hover:bg-slate-600 transition";
            });
            botonActivo.className = "btn-exigencia bg-emerald-500 border border-emerald-400 rounded-xl py-2 text-xs font-bold text-slate-950 shadow-lg shadow-emerald-500/20";
        }

        // ALGORITMO PRINCIPAL: GENERAR LA RUTINA FILTRANDO MATERIAL Y ENFOQUE
        function generarRutina() {
            const enfoque = document.getElementById('select-enfoque').value;
            const musculoEspecifico = document.getElementById('select-musculo').value;
            
            // Capturar equipamiento disponible
            const eqDisponibles = [];
            if(document.getElementById('eq-mancuernas').checked) eqDisponibles.push('mancuernas');
            if(document.getElementById('eq-kettlebells').checked) eqDisponibles.push('kettlebells');
            if(document.getElementById('eq-barra').checked) eqDisponibles.push('barra');
            if(document.getElementById('eq-banco').checked) eqDisponibles.push('banco');

            // Filtrar del dataset base
            let ejerciciosFiltrados = datasetEjercicios.filter(ej => {
                // Validación estricta de material: si el ejercicio requiere equipamiento, debes tenerlo activo
                if (ej.eq.length > 0) {
                    return ej.eq.every(material => eqDisponibles.includes(material));
                }
                return true; // Si es peso corporal libre, entra siempre
            });

            // Filtrar por enfoque anatómico seleccionado
            if (enfoque === 'torso') {
                ejerciciosFiltrados = ejerciciosFiltrados.filter(ej => ej.zone === 'torso');
            } else if (enfoque === 'pierna') {
                ejerciciosFiltrados = ejerciciosFiltrados.filter(ej => ej.zone === 'pierna');
            } else if (enfoque === 'especifico') {
                ejerciciosFiltrados = ejerciciosFiltrados.filter(ej => ej.target === musculoEspecifico);
            }

            // Si el filtro nos deja vacíos por falta de material seleccionado, avisamos
            if (ejerciciosFiltrados.length === 0) {
                alert("⚠️ No hay ejercicios compatibles. Activa más casillas de material en el configurador.");
                return;
            }

            // Barajar aleatoriamente y seleccionar un máximo razonable (4-5 ejercicios para balancear la sesión)
            ejerciciosFiltrados.sort(() => 0.5 - Math.random());
            const cantidadSeleccionada = Math.min(ejerciciosFiltrados.length, 5);
            rutinaGeneradaActual = ejerciciosFiltrados.slice(0, cantidadSeleccionada);

            // Renderizar en el DOM
            renderizarRutinaActiva();
        }

        // FUNCIÓN DE RENDERIZADO DE LA SECCIÓN DE ENTRENAMIENTO
        function renderizarRutinaActiva() {
            const wrapper = document.getElementById('rutina-activa-wrapper');
            const lista = document.getElementById('lista-ejercicios');
            const contador = document.getElementById('contador-ejercicios');

            lista.innerHTML = "";
            contador.innerText = `${rutinaGeneradaActual.length} Ejercicios pautados`;

            rutinaGeneradaActual.forEach((ej, indexEj) => {
                // Construcción de filas de series estilo tabla Hevy App
                let filasSeriesHTML = "";
                for (let i = 1; i <= numSeriesPorEjercicio; i++) {
                    filasSeriesHTML += `
                        <tr class="border-b border-slate-700/50 text-center text-xs">
                            <td class="py-2 text-slate-400 font-mono font-bold">${i}</td>
                            <td class="py-2">
                                <input type="number" placeholder="0" class="w-14 bg-slate-800 text-white border border-slate-600 rounded p-1 text-center font-mono focus:border-emerald-500 focus:outline-none" id="peso-${indexEj}-${i}">
                            </td>
                            <td class="py-2">
                                <input type="number" placeholder="10" class="w-14 bg-slate-800 text-white border border-slate-600 rounded p-1 text-center font-mono focus:border-emerald-500 focus:outline-none" id="reps-${indexEj}-${i}">
                            </td>
                            <td class="py-2">
                                <button type="button" onclick="marcarSerieCompletada(this)" class="bg-slate-700 text-slate-400 border border-slate-600 hover:bg-emerald-600 hover:text-slate-950 font-bold px-2 py-1 rounded transition duration-150">
                                    <i class="fa-solid fa-check"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                }

                // Nodo contenedor de la tarjeta del ejercicio con consejos y el GIF integrado
                // El gif apunta a la estructura oficial del repositorio en GitHub facilitado
                const urlBaseGifs = "https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/videos/";
                const urlCompletaGif = `${urlBaseGifs}${ej.id}-${ej.gif}.gif`;

                const tarjetaHTML = `
                    <div class="bg-slate-850 rounded-2xl border border-slate-700 overflow-hidden shadow-md animate-fadeIn">
                        
                        <!-- Header del Ejercicio -->
                        <div class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-start">
                            <div>
                                <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-md">${ej.target.toUpperCase()}</span>
                                <h3 class="text-sm font-bold text-white mt-1.5">${ej.esp}</h3>
                                <p class="text-[11px] text-slate-400 font-mono italic">${ej.name}</p>
                            </div>
                            <span class="text-xs font-semibold text-slate-500"><i class="fa-solid fa-layer-group mr-1"></i>${numSeriesPorEjercicio}S</span>
                        </div>

                        <!-- Zona Multimedia y Consejos Técnicos -->
                        <div class="p-4 bg-slate-850/50 grid grid-cols-12 gap-3 border-b border-slate-700/50">
                            <!-- Contenedor del GIF -->
                            <div class="col-span-4 bg-slate-800 rounded-xl overflow-hidden flex items-center justify-center border border-slate-700 h-24 relative group">
                                <img src="${urlCompletaGif}" alt="${ej.name}" class="object-cover w-full h-full" onerror="this.onerror=null; this.src='https://placehold.co/180x180/1e293b/ffffff?text=GIF';">
                            </div>
                            <!-- Detalles y Consejos Ejecución -->
                            <div class="col-span-8 flex flex-col justify-center">
                                <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1"><i class="fa-solid fa-circle-info mr-1 text-teal-400"></i>Consejo de Ejecución:</h4>
                                <p class="text-xs text-slate-300 leading-relaxed font-normal">${ej.cues}</p>
                            </div>
                        </div>

                        <!-- Tabla Interactiva estilo Diario Hevy -->
                        <div class="p-3 bg-slate-850">
                            <table class="w-full">
                                <thead>
                                    <tr class="text-slate-400 text-[10px] font-bold uppercase tracking-wider text-center border-b border-slate-700">
                                        <th class="pb-1 text-left pl-2 w-12">SERIE</th>
                                        <th class="pb-1 w-20">KG</th>
                                        <th class="pb-1 w-20">REPS</th>
                                        <th class="pb-1 w-16">CHECK</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${filasSeriesHTML}
                                </tbody>
                            </table>
                        </div>

                        <!-- Campo de Nota Particular por Ejercicio -->
                        <div class="px-4 pb-3 pt-1 bg-slate-850">
                            <input type="text" placeholder="Añadir nota particular para este ejercicio..." class="w-full bg-slate-800 text-xs text-slate-300 border border-slate-700 rounded-lg px-2.5 py-1.5 placeholder-slate-500 focus:outline-none focus:border-emerald-500" id="nota-particular-${indexEj}">
                        </div>

                    </div>
                `;
                lista.innerHTML += tarjetaHTML;
            });

            wrapper.classList.remove('hidden');
            wrapper.scrollIntoView({ behavior: 'smooth' });
        }

        // Cambiar el estado visual al completar una serie individual
        function marcarSerieCompletada(btn) {
            const fila = btn.closest('tr');
            if (fila.classList.contains('bg-emerald-950/40')) {
                // Desmarcar
                fila.classList.remove('bg-emerald-950/40', 'text-slate-500');
                btn.className = "bg-slate-700 text-slate-400 border border-slate-600 hover:bg-emerald-600 hover:text-slate-950 font-bold px-2 py-1 rounded transition duration-150";
            } else {
                // Marcar como hecho
                fila.classList.add('bg-emerald-950/40', 'text-slate-500');
                btn.className = "bg-emerald-500 text-slate-950 border border-emerald-400 font-bold px-2 py-1 rounded transition duration-150";
            }
        }

        // 3. SECCIÓN DE PERSISTENCIA Y GUARDADO EN HISTORIAL (LOCALSTORAGE)
        function finalizarRutina() {
            // Validar que se ha entrenado algo
            if(rutinaGeneradaActual.length === 0) return;

            const datosEjerciciosGuardar = [];

            rutinaGeneradaActual.forEach((ej, indexEj) => {
                const seriesData = [];
                for (let i = 1; i <= numSeriesPorEjercicio; i++) {
                    const peso = document.getElementById(`peso-${indexEj}-${i}`).value || "0";
                    const reps = document.getElementById(`reps-${indexEj}-${i}`).value || "0";
                    seriesData.push(`${peso}kg x ${reps}`);
                }
                const notaParticular = document.getElementById(`nota-particular-${indexEj}`).value || "";
                
                datosEjerciciosGuardar.push({
                    nombre: ej.esp,
                    series: seriesData,
                    nota: notaParticular
                });
            });

            const notaGlobal = document.getElementById('notas-sesion').value || "Sin observaciones.";
            const fechaActual = new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' });
            const enfoqueSeleccionado = document.getElementById('select-enfoque').value.toUpperCase();

            // Objeto de registro de sesión completo
            const nuevaSesionHistorial = {
                fecha: fechaActual,
                enfoque: enfoqueSeleccionado,
                ejercicios: datosEjerciciosGuardar,
                notaGlobal: notaGlobal
            };

            // Extraer historial previo del LocalStorage
            let historialPrevio = JSON.parse(localStorage.getItem('historial_fuerza_tracker')) || [];
            historialPrevio.unshift(nuevaSesionHistorial); // Añadir al inicio del array
            localStorage.setItem('historial_fuerza_tracker', JSON.stringify(historialPrevio));

            // Feedback visual, ocultar zona activa y refrescar historial en el DOM
            alert("💪 ¡Entrenamiento guardado con éxito en tu diario histórico!");
            document.getElementById('rutina-activa-wrapper').classList.add('hidden');
            rutinaGeneradaActual = [];
            cargarHistorialDOM();
        }

        // CARGAR EL HISTORIAL DESDE LOCALSTORAGE AL DOM
        function cargarHistorialDOM() {
            const contenedor = document.getElementById('contenedor-historial');
            const historial = JSON.parse(localStorage.getItem('historial_fuerza_tracker')) || [];

            if (historial.length === 0) {
                contenedor.innerHTML = '<p id="historial-vacio" class="text-xs text-slate-500 text-center py-4 italic">No hay entrenamientos registrados todavía.</p>';
                return;
            }

            contenedor.innerHTML = "";
            historial.forEach(sesion => {
                let ejerciciosHTML = "";
                sesion.ejercicios.forEach(ej => {
                    ejerciciosHTML += `
                        <div class="mt-1.5 border-l-2 border-slate-600 pl-2">
                            <p class="text-xs font-semibold text-slate-200">${ej.nombre}</p>
                            <p class="text-[11px] text-slate-400 font-mono">${ej.series.join(' | ')}</p>
                            ${ej.nota ? `<p class="text-[10px] text-teal-400/90 italic"><i class="fa-solid fa-comment-dots mr-1"></i>${ej.nota}</p>` : ''}
                        </div>
                    `;
                });

                const tarjetaHistorial = `
                    <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 space-y-2 text-xs">
                        <div class="flex justify-between items-center bg-slate-750 p-1.5 rounded-lg border border-slate-700/50">
                            <span class="font-bold text-emerald-400"><i class="fa-solid fa-calendar-day mr-1"></i>${sesion.fecha}</span>
                            <span class="bg-slate-700 text-slate-300 font-mono text-[9px] px-1.5 py-0.5 rounded uppercase">${sesion.enfoque}</span>
                        </div>
                        <div class="space-y-1">
                            ${ejerciciosHTML}
                        </div>
                        <div class="bg-slate-850 p-2 rounded-lg border border-slate-700 text-[11px] text-slate-400">
                            <span class="text-[10px] font-bold block text-slate-500 uppercase"><i class="fa-solid fa-quote-left mr-1"></i>Nota Global:</span>
                            ${sesion.notaGlobal}
                        </div>
                    </div>
                `;
                contenedor.innerHTML += tarjetaHistorial;
            });
        }

        // LIMPIAR CONFIGURACIÓN DE HISTORIAL
        function limpiarHistorial() {
            if(confirm("¿Estás seguro de que deseas borrar todo el diario histórico de entrenamientos?")) {
                localStorage.removeItem('historial_fuerza_tracker');
                cargarHistorialDOM();
            }
        }

        // Iniciar la carga al abrir el archivo por primera vez
        window.onload = function() {
            cargarHistorialDOM();
        };
    </script>
</body>
</html>
